allowBuilds:
  esbuild: false # tsx uses the platform package; no install script is required
minimumReleaseAgeExclude:
  - dependency-cruiser@18.1.1
packageExtensions:
  # dependency-cruiser 18.1.1 supports TypeScript <7, so keep its parser isolated from project TS 7.
  dependency-cruiser@18.1.1:
    dependencies:
      typescript: 6.0.3
