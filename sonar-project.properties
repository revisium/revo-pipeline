sonar.projectKey=revisium_revo-pipeline
sonar.organization=revisium
sonar.projectName=revo-pipeline
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.ts
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=dist/**,coverage/**,node_modules/**,**/generated/**,**/fixtures/**
sonar.coverage.exclusions=test/**,scripts/**
sonar.cpd.exclusions=test/**,**/generated/**,**/fixtures/**

# Accepted semantic public aliases intentionally distinguish domain keys from strings.
# Transition validation is deliberately bounded, descriptor-safe, and fail-closed; splitting
# these state machines to satisfy cognitive-complexity scoring would duplicate traversal state.
# Exact field ordering uses the package's locale-independent Unicode code-point comparator;
# localeCompare would violate deterministic portable semantics. Sonar's preferred array-membership
# form conflicts with its previously required predicate form in the core decision implementation.
sonar.issue.ignore.multicriteria=acceptedBranchNameAlias,acceptedCandidateKeyAlias,acceptedFactKeyAlias,acceptedNodeKeyAlias,acceptedResolutionNameAlias,boundedFactInspection,coreDecisionStateMachine,boundedCompiledInspection,coreDecisionMembership
